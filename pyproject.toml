[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digate"
version = "0.1.0"
description = "Digest-bound release promotion gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pynacl>=1.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
digate = "digate.cli:main"

[tool.setuptools.packages.find]
include = ["digate*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
